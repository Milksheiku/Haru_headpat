const M={x:W/2,y:H/2,px:W/2,py:H/2,vx:0,in:false};
const PIV=[855,1440],EARS=[{q:[502,535],a:[-.337,-.941]},{q:[1165,502],a:[.47,-.88]}];
const inHead=(x,y)=>((x-855)/540)**2+((y-850)/590)**2<1||Math.hypot(x-480,y-400)<150||Math.hypot(x-1215,y-400)<150;

// ---- deformação (estilo Live2D): cabeça, orelhas, mechas e corpo ----
function headT(x,y){const th=S.tilt.x,c=Math.cos(th),s=Math.sin(th),p=S.press.x,sx=1+.016*p,sy=1-.04*p;
 const dx=(x-PIV[0])*sx,dy=(y-PIV[1])*sy;return[PIV[0]+dx*c-dy*s+S.ox.x,PIV[1]+dx*s+dy*c+p*13+Math.sin(S.t*1.7)*.8]}
function warp(x,y){
 const wH=ss(1520,1380,y),h=headT(x,y);let X=x+wH*(h[0]-x),Y=y+wH*(h[1]-y);
 X+=S.sway.x*ss(900,1400,y)*ss(190,330,Math.abs(x-855))*wH;
 [S.eL.x+S.iL.x,S.eR.x+S.iR.x].forEach((e,i)=>{const E=EARS[i],q=headT(E.q[0],E.q[1]),al=(x-E.q[0])*E.a[0]+(y-E.q[1])*E.a[1],pe=-(x-E.q[0])*E.a[1]+(y-E.q[1])*E.a[0];
  const w=ss(0,120,al)*Math.exp(-((pe/135)**2))*(1-ss(330,430,al)),a=e*w*(i?1:-1),c=Math.cos(a),s=Math.sin(a),dx=X-q[0],dy=Y-q[1];
  X=q[0]+dx*c-dy*s;Y=q[1]+dx*s+dy*c});
 Y+=S.press.x*6*ss(1380,1650,y)*(1-ss(1950,2298,y));
 return[X,Y]}

// ---- WebGL: malha com a textura original ----
const NX=52,NY=64,pos=new Float32Array((NX+1)*(NY+1)*2),uv=new Float32Array(pos.length),idx=new Uint32Array(NX*NY*6);
for(let j=0,k=0;j<=NY;j++)for(let i=0;i<=NX;i++,k+=2){uv[k]=i/NX;uv[k+1]=j/NY}
for(let j=0,k=0;j<NY;j++)for(let i=0;i<NX;i++){const a=j*(NX+1)+i,b=a+1,c=a+NX+1,d=c+1;idx.set([a,b,c,b,d,c],k);k+=6}
function prog(){const mk=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o},p=gl.createProgram();
 gl.attachShader(p,mk(gl.VERTEX_SHADER,`#version 300 es
in vec2 p;in vec2 u;uniform vec2 R;out vec2 v;void main(){v=u;gl_Position=vec4(p.x/R.x*2.-1.,1.-p.y/R.y*2.,0,1);}`));
 gl.attachShader(p,mk(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;in vec2 v;out vec4 o;uniform sampler2D A,B;uniform float lid;
void main(){float L=mix(.405,.505,lid);o=mix(texture(B,v),texture(A,v),smoothstep(L-.004,L+.004,v.y));}`));
 gl.linkProgram(p);return p}
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
function tex(src,unit){const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);gl.generateMipmap(gl.TEXTURE_2D);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE)}
let P,pbuf,sc=1,lidU;
async function init(){
 const [img,patch]=await Promise.all([load(SRC),load(PATCH)]);
 const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");g.drawImage(img,0,0);g.drawImage(patch,PX,PY);
 P=prog();gl.useProgram(P);tex(img,0);tex(c,1);
 gl.uniform1i(gl.getUniformLocation(P,"A"),0);gl.uniform1i(gl.getUniformLocation(P,"B"),1);gl.uniform2f(gl.getUniformLocation(P,"R"),W,H);lidU=gl.getUniformLocation(P,"lid");
 pbuf=gl.createBuffer();const ub=gl.createBuffer();
 const pl=gl.getAttribLocation(P,"p"),ul=gl.getAttribLocation(P,"u");
 gl.bindBuffer(gl.ARRAY_BUFFER,ub);gl.bufferData(gl.ARRAY_BUFFER,uv,gl.STATIC_DRAW);gl.enableVertexAttribArray(ul);gl.vertexAttribPointer(ul,2,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,pbuf);gl.bufferData(gl.ARRAY_BUFFER,pos,gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
 resize();addEventListener("resize",resize);requestAnimationFrame(loop)}
function resize(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);
 stage.style.width=W*s+"px";stage.style.height=H*s+"px";stage.style.marginTop=(innerHeight-H*s)/2+"px";
 for(const c of[cv,fx]){c.width=Math.round(W*s*d);c.height=Math.round(H*s*d)}sc=cv.width/W;gl.viewport(0,0,cv.width,cv.height)}

// ---- mouse / toque ----
function pt(e){const r=cv.getBoundingClientRect();M.x=(e.clientX-r.left)/r.width*W;M.y=(e.clientY-r.top)/r.height*H;M.in=true}
fx.addEventListener("pointermove",pt);fx.addEventListener("pointerleave",()=>M.in=false);fx.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse")M.in=false});
fx.addEventListener("pointerdown",e=>{pt(e);if(inHead(M.x,M.y)){S.press.v+=9;S.eL.v+=2.5;S.eR.v+=2.5;burst(5)}});

const hearts=[];
function burst(n){for(let i=0;i<n;i++)hearts.push({x:M.x+(Math.random()-.5)*260,y:M.y-120-Math.random()*60,vx:(Math.random()-.5)*50,vy:-90-Math.random()*70,a:1,s:42+Math.random()*34,c:["#ff8fb1","#ffb3cf","#8fc8f5"][i%3]})}

function step(dt){
 S.t+=dt;const over=M.in&&inHead(M.x,M.y),dist=Math.hypot(M.x-M.px,M.y-M.py);
 M.vx+=((M.x-M.px)/dt-M.vx)*Math.min(1,dt*12);M.px=M.x;M.py=M.y;
 if(over){S.phase+=dt*7+dist*.02;S.patT+=dt;S.heartT+=dt;if(S.heartT>.5&&S.happy>.6){S.heartT=0;burst(1)}$("hint").style.opacity=0}else{S.patT=0;S.heartT=0}
 const side=cl((M.x-855)/520,-1,1);
 sp(S.press,over?.55+.45*Math.sin(S.phase):0,260,16,dt);
 sp(S.tilt,over?side*.034+cl(M.vx/3500,-1,1)*.02:0,90,9,dt);
 sp(S.ox,over?side*18:0,70,10,dt);
 sp(S.sway,cl(-S.ox.v*.16,-16,16)+Math.sin(S.t*.9),55,6,dt);
 sp(S.eL,over?.3:0,120,9,dt);sp(S.eR,over?.3:0,120,9,dt);sp(S.iL,0,200,10,dt);sp(S.iR,0,200,10,dt);
 S.nextEar-=dt;if(S.nextEar<0&&!over){S.nextEar=4+Math.random()*5;(Math.random()<.5?S.iL:S.iR).v+=1.3}
 S.happy+=((over?1:0)-S.happy)*(1-Math.exp(-7*dt));S.hand+=((over?1:0)-S.hand)*(1-Math.exp(-14*dt));
 S.nextBlink-=dt;if(S.nextBlink<0&&S.blink<0){S.blink=0}
 let bl=0;if(S.blink>=0){S.blink+=dt/.17;bl=Math.sin(Math.min(S.blink,1)*Math.PI);if(S.blink>=1){S.blink=-1;S.nextBlink=2.5+Math.random()*3.5}}
 S.lid=Math.max(bl,ss(.15,.85,S.happy))}

function curve(cx,cy,hw,hp,col){ // pálpebra fechada: ◡ (piscada) → ∩ (feliz)
 const k=S.happy,p=[];
 for(let i=0;i<=18;i++){const t=i/18,x=cx-hw+2*hw*t,y=(1-t)*(1-t)*(cy+6)+2*t*(1-t)*(cy+6+(60-150*k)/2*1)+t*t*(cy+6);p.push(warp(x,y))}
 const al=ss(.8,1,S.lid);if(al<=.01)return;ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineCap="round";ctx.lineJoin="round";
 for(let i=0;i<18;i++){const t=i/18,w=11*Math.sin(Math.PI*(.12+.76*t))+3.5;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(...p[i]);ctx.lineTo(...p[i+1]);ctx.stroke()}
 ctx.globalAlpha=1}

function hand(x,y,a){ // mãozinha do headpat
 const skin="#ffe2cf",ln="#e0a58f";ctx.save();ctx.translate(x,y);ctx.rotate(-.28);ctx.scale(4.3,4.3);ctx.globalAlpha=a;ctx.lineWidth=2.6;ctx.strokeStyle=ln;ctx.fillStyle=skin;
 const rr=(X,Y,w,h,r,f)=>{ctx.beginPath();ctx.roundRect(X,Y,w,h,r);ctx.fill();ctx.stroke();if(f){ctx.fillStyle=f}};
 [44,54,52,42].forEach((l,i)=>rr(-30+i*16.5,8,15,l,7.5));
 ctx.save();ctx.translate(-32,-2);ctx.rotate(.75);rr(-44,-9,46,17,8.5);ctx.restore();
 rr(-37,-38,74,64,22);
 ctx.fillStyle="#bfe0f7";ctx.strokeStyle="#8fbfe3";rr(-40,-62,80,28,8);ctx.fillStyle="#fff";rr(-44,-70,88,13,6.5);
 ctx.restore()}

function draw(){
 let k=0;
 for(let j=0;j<=NY;j++)for(let i=0;i<=NX;i++){const w=warp(i/NX*W,j/NY*H);pos[k++]=w[0];pos[k++]=w[1]}
 gl.bindBuffer(gl.ARRAY_BUFFER,pbuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,pos);gl.uniform1f(lidU,S.lid);
 gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_INT,0);
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,fx.width,fx.height);ctx.setTransform(sc,0,0,sc,0,0);
 const hb=S.happy; // blush
 if(hb>.02)for(const c of[[640,1170],[1050,1172]]){const w=warp(c[0],c[1]),g=ctx.createRadialGradient(w[0],w[1],0,w[0],w[1],85);
  g.addColorStop(0,`rgba(255,110,150,${.34*hb})`);g.addColorStop(1,"rgba(255,110,150,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(w[0],w[1],85,0,7);ctx.fill()}
 curve(648,1057,70,0,"#3a2527");curve(1062,1055,72,0,"#3a2527");
 for(let i=hearts.length-1;i>=0;i--){const h=hearts[i];h.x+=h.vx*.016;h.y+=h.vy*.016;h.a-=.011;if(h.a<=0){hearts.splice(i,1);continue}
  ctx.globalAlpha=h.a;ctx.fillStyle=h.c;ctx.font=`${h.s*2}px sans-serif`;ctx.textAlign="center";ctx.fillText("♥",h.x,h.y);ctx.globalAlpha=1}
 if(S.hand>.02)hand(M.x+25,M.y-100+S.press.x*28,S.hand);
 fx.style.cursor=M.in&&inHead(M.x,M.y)?"none":"default"}

let last=0;function loop(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;step(dt);draw();requestAnimationFrame(loop)}
if(!gl)document.body.insertAdjacentHTML("beforeend","<p style='padding:2em'>Seu navegador não suporta WebGL2.</p>");else init();
</script>
</body>
</html>
